[project]
name = "portafolio-datos"
version = "1.0.0"
description = "Portfolio de análisis y automatización de datos - Juan Sebastián Bermúdez"
authors = [{name = "Juan Sebastián Bermúdez", email = "jsbermudezv@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pandas>=1.3.0",
    "geopandas>=0.10.0",
    "pdfplumber>=0.7.0",
    "pymupdf>=1.23.0",
    "openpyxl>=3.8.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=0.7.0",
    "google-auth-httplib2>=0.1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "pytest>=7.0.0",
]

geospatial = [
    "folium>=0.12.0",
    "maplibre>=0.1.0",
    "shapely>=1.8.0",
]

ocr = [
    "pytesseract>=0.3.10",
    "pillow>=9.0.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://jsbermudezv.github.io/portafolio"
GitHub = "https://github.com/jsbermudezv-crypto/Portafolio"
LinkedIn = "https://linkedin.com/in/jsbermudezv"
